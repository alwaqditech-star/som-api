version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: som_auctions_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: som_auctions
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: som_auctions_api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: som_auctions
      JWT_SECRET: change-me-in-production
    depends_on:
      - postgres

volumes:
  postgres_data:
